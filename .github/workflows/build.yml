name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle if missing
      run: |
        if [ ! -f "./gradlew" ]; then
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Find and Move APK
      run: |
        mkdir -p my_apk
        find . -name "*.apk" -exec cp {} my_apk/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: my_apk/
        
